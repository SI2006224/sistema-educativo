<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Cursos - Sistema Educativo</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/mobile.css">
</head>
<body>
    <div id="app">
        <header class="top-bar">
            <div class="top-bar-left">
                <img src="/assets/logo.png" alt="Logo" class="top-logo">
                <span class="top-title">Sistema Educativo</span>
            </div>
            <div class="top-bar-right">
                <span id="user-name" class="user-name">Usuario</span>
                <button id="logout-btn" class="btn-logout">Cerrar Sesión</button>
            </div>
        </header>
        
        <main class="main-content">
            <div class="page-header">
                <h2>Gestión de Cursos</h2>
                <button id="btn-nuevo-curso" class="btn-primary">+ Nuevo Curso</button>
            </div>
            
            <!-- Filtros -->
            <div class="filters">
                <input type="text" id="search-curso" placeholder="Buscar curso...">
                <select id="filter-turno">
                    <option value="">Todos los turnos</option>
                    <option value="M">Mañana</option>
                    <option value="T">Tarde</option>
                    <option value="N">Noche</option>
                </select>
            </div>
            
            <!-- Tabla de cursos -->
            <div class="table-container">
                <table id="cursos-table" class="data-table">
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Año</th>
                            <th>Turno</th>
                            <th>Estudiantes</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="cursos-list">
                        <tr><td colspan="5" class="loading-text">Cargando cursos...</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
        
        <!-- Modal para nuevo/editar curso -->
        <div id="curso-modal" class="modal" style="display:none;">
            <div class="modal-content">
                <span class="modal-close">&times;</span>
                <h3 id="modal-title">Nuevo Curso</h3>
                <form id="curso-form">
                    <input type="hidden" id="curso-id">
                    <div class="form-group">
                        <label for="curso-codigo">Código</label>
                        <input type="text" id="curso-codigo" placeholder="Ej: 71CO" required>
                    </div>
                    <div class="form-group">
                        <label for="curso-anno">Año Lectivo</label>
                        <input type="text" id="curso-anno" placeholder="Ej: 2026" required>
                    </div>
                    <div class="form-group">
                        <label for="curso-turno">Turno</label>
                        <select id="curso-turno" required>
                            <option value="M">Mañana</option>
                            <option value="T">Tarde</option>
                            <option value="N">Noche</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="curso-descripcion">Descripción</label>
                        <textarea id="curso-descripcion" placeholder="Descripción del curso"></textarea>
                    </div>
                    <button type="submit" class="btn-primary btn-block">Guardar</button>
                </form>
            </div>
        </div>
        
        <nav class="bottom-nav">
            <button class="nav-item" data-view="dashboard">🏠 Inicio</button>
            <button class="nav-item active" data-view="cursos">📚 Cursos</button>
            <button class="nav-item" data-view="estudiantes">👨‍🎓 Estudiantes</button>
            <button class="nav-item" data-view="asistencias">📋 Asistencias</button>
            <button class="nav-item" data-view="notas">📊 Notas</button>
            <button class="nav-item" data-view="reportes">📄 Reportes</button>
        </nav>
    </div>
    
    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/components/auth.js"></script>
    <script src="/js/components/cursos.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
